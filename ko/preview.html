<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HDPS 브로셔 · 한 화면 한 페이지 미리보기</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06111b;font-family:Arial,"Noto Sans KR",sans-serif}
#book{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
.preview-badge{position:fixed;z-index:20;left:18px;top:16px;padding:9px 13px;border-radius:999px;background:rgba(6,17,27,.88);color:#fff;font-size:11px;font-weight:900;letter-spacing:.04em;box-shadow:0 8px 24px rgba(0,0,0,.22);backdrop-filter:blur(10px)}
.preview-help{position:fixed;z-index:20;right:18px;bottom:17px;display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:999px;background:rgba(6,17,27,.86);color:#d8e1e7;font-size:10px;box-shadow:0 8px 24px rgba(0,0,0,.22);backdrop-filter:blur(10px)}
.preview-help button{width:34px;height:30px;border:1px solid rgba(255,255,255,.22);border-radius:999px;background:rgba(255,255,255,.08);color:#fff;cursor:pointer;font-size:16px}
</style>
</head>
<body>
<iframe id="book" src="./" title="HDPS 한국어 브로셔 미리보기"></iframe>
<div class="preview-badge">ONE PAGE PREVIEW · 한국어판</div>
<div class="preview-help"><span>휠 또는 버튼으로 페이지 이동</span><button id="prev" aria-label="이전 페이지">↑</button><button id="next" aria-label="다음 페이지">↓</button></div>
<script>
const frame=document.getElementById('book');
const childCss=`
html{scroll-snap-type:y mandatory!important;scroll-behavior:smooth!important}
body{overflow-x:hidden!important}
.topbar,.bookmarks,.backtop,.hdps-library-return,footer,.progress{display:none!important}
main section{height:100vh!important;min-height:100vh!important;max-height:100vh!important;overflow:hidden!important;scroll-snap-align:start!important;scroll-snap-stop:always!important;padding:clamp(28px,4vh,52px) clamp(34px,5vw,76px)!important}
main section.hero{padding-top:clamp(34px,6vh,62px)!important}
main section.__modules-page .board-deck{grid-template-columns:repeat(3,minmax(0,1fr))!important}
main section.__modules-page .board-card{min-height:360px!important}
main section.__target-a .target-impact-grid{grid-template-columns:1fr!important}
main section.__target-a .target-story{max-width:1180px!important;margin:0 auto!important}
main section.__target-b .target-side{max-width:1160px!important;margin:0 auto!important;display:grid!important;grid-template-columns:.7fr 1.3fr!important;gap:28px!important;align-items:center!important}
.__page-fit{position:relative;display:inherit;grid-template-columns:inherit;grid-template-rows:inherit;gap:inherit;align-items:inherit;justify-content:inherit;flex-direction:inherit;transform-origin:top left}\nsection.framework .__page-fit>.section-head{grid-column:1/-1;width:100%}
.__page-number{position:absolute;right:24px;bottom:16px;z-index:50;color:#7d8992;font:800 10px Arial;letter-spacing:.12em}
@media(max-width:800px){main section.__target-b .target-side{grid-template-columns:1fr!important}.preview-badge{display:none}}
`;
function splitPages(doc){
  const modules=doc.querySelector('#modules');
  if(modules&&!doc.querySelector('#modules-2')){
    const copy=modules.cloneNode(true); copy.id='modules-2';
    copy.querySelectorAll('.board-card').forEach((card,i)=>{if(i<3)card.remove()});
    modules.querySelectorAll('.board-card').forEach((card,i)=>{if(i>=3)card.remove()});
    modules.classList.add('__modules-page');copy.classList.add('__modules-page');
    const h2=copy.querySelector('.section-head h2');if(h2)h2.textContent='19개 모듈, 현장을 움직이는 실행 체계';
    modules.after(copy);
  }
  const target=doc.querySelector('#target');
  if(target&&!doc.querySelector('#target-2')){
    const copy=target.cloneNode(true);copy.id='target-2';
    target.classList.add('__target-a');copy.classList.add('__target-b');
    target.querySelector('.target-side')?.remove();
    target.querySelector('.target-manifesto')?.remove();
    copy.querySelector('.target-impact-head')?.remove();
    copy.querySelector('.target-story')?.remove();
    target.after(copy);
  }
}
function fitPages(doc){
  const pages=[...doc.querySelectorAll('main section')];
  pages.forEach((page,index)=>{
    if(!page.querySelector(':scope > .__page-fit')){
      const wrap=doc.createElement('div');wrap.className='__page-fit';
      while(page.firstChild)wrap.appendChild(page.firstChild);
      page.appendChild(wrap);
      const num=doc.createElement('span');num.className='__page-number';num.textContent=String(index+1).padStart(2,'0')+' / '+String(pages.length).padStart(2,'0');page.appendChild(num);
    }
  });
  requestAnimationFrame(()=>pages.forEach(page=>{
    const wrap=page.querySelector(':scope > .__page-fit');
    wrap.style.transform='none';wrap.style.width='100%';
    const cs=getComputedStyle(page),available=page.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom)-8;
    const needed=wrap.scrollHeight;
    const scale=Math.min(1,available/needed);
    wrap.style.width=(100/scale)+'%';
    wrap.style.transform='scale('+scale+')';
  }));
}
frame.addEventListener('load',()=>{
  const doc=frame.contentDocument;
  const style=doc.createElement('style');style.textContent=childCss;doc.head.appendChild(style);
  splitPages(doc);fitPages(doc);
  frame.contentWindow.addEventListener('resize',()=>fitPages(doc));
});
function move(dir){
  const win=frame.contentWindow,doc=frame.contentDocument,pages=[...doc.querySelectorAll('main section')];
  const y=win.scrollY,idx=Math.round(y/win.innerHeight),next=Math.max(0,Math.min(pages.length-1,idx+dir));
  pages[next]?.scrollIntoView({behavior:'smooth',block:'start'});
}
document.getElementById('prev').onclick=()=>move(-1);
document.getElementById('next').onclick=()=>move(1);
</script>
</body>
</html>
