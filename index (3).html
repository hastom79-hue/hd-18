<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HDPS · English</title>
<style>
html,body{margin:0;min-height:100%;background:#0b0f15;color:#fff;font-family:Arial,sans-serif}
.loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:28px;background:radial-gradient(circle at 50% 30%,rgba(39,87,132,.2),transparent 35%),#0b0f15}
.loading .book{width:150px;height:210px;margin:auto;border-radius:6px 12px 12px 5px;background:linear-gradient(145deg,#0e2a50,#0d6655);box-shadow:0 28px 60px rgba(0,0,0,.45);display:grid;place-items:center;font-weight:900;font-size:34px}
.loading p{color:#8d99a6;line-height:1.7;font-size:12px}
</style>
<script>
(()=>{const q=new URLSearchParams(location.search);if(q.get('from')!=='library'){location.replace('../?choose=1');}})();
</script>
</head>
<body>
<div class="loading"><div><div class="book">HDPS</div><p>Digital book loading…</p></div></div>
<script>
(async()=>{
  const repo='hd-12', lang='en';
  const base=`https://cdn.jsdelivr.net/gh/hastom79-hue/${repo}@main/`;
  try{
    const res=await fetch(base+'index.html',{cache:'no-store'});
    if(!res.ok)throw new Error('HTML '+res.status);
    let html=await res.text();

    html=html.replace(/<a\b[^>]*href=["']#top["'][^>]*>\s*<img\b[^>]*class=["'][^"']*\blogo\b[^"']*["'][^>]*>\s*<\/a>/i,'');
    html=html.replace(/<a\b[^>]*aria-label=["'][^"']*(?:HD현대|HD Hyundai|Logotipo HD Hyundai|HD Hyundai 标志)[^"']*["'][^>]*>[\s\S]*?<\/a>/i,'');
    html=html.replace(/href=["']style\.css(?:\?[^"']*)?["']/i,`href="${base}style.css"`);
    html=html.replace(/src=["']script\.js(?:\?[^"']*)?["']/i,`src="${base}script.js"`);

    const extra=`<style>
      .topbar{justify-content:flex-end!important}
      .logo{display:none!important}
      #hd18-controls{position:fixed;z-index:999999;left:14px;bottom:14px;display:flex;gap:7px;font-family:Arial,sans-serif}
      #hd18-controls button{border:1px solid rgba(255,255,255,.18);background:rgba(8,15,26,.9);color:#fff;border-radius:999px;padding:9px 12px;font-size:10px;font-weight:800;cursor:pointer;box-shadow:0 9px 25px rgba(0,0,0,.25)}
      #hd18-controls button.saved{background:#00a651}
      #hd18-pub{position:fixed;z-index:999998;left:50%;bottom:14px;transform:translateX(-50%);padding:8px 11px;border-radius:999px;background:rgba(8,15,26,.86);color:#fff;font:800 9px/1.4 Arial,sans-serif;white-space:nowrap}
      @media(max-width:760px){#hd18-pub{display:none}#hd18-controls{left:8px;bottom:8px}}
    </style>`;
    html=html.replace('</head>',extra+'</head>');
    const controls=`<div id="hd18-controls"><button id="hd18-home">← Library</button><button id="hd18-bookmark">☆ Bookmark</button></div>
    <div id="hd18-pub">지은이 · HQ 생산혁신팀 서지철 책임매니저　|　발간일 · 2026.08.20　|　© 2026 서지철 · 무단 복제 금지 · 무단 배포 금지</div>
    <script>(()=>{const k='hdps-bookmark',l='${lang}',b=document.getElementById('hd18-bookmark');
    const sync=()=>{let on=false;try{on=localStorage.getItem(k)===l}catch(e){}b.classList.toggle('saved',on);b.textContent=on?'★ Bookmarked':'☆ Bookmark'};
    document.getElementById('hd18-home').onclick=()=>location.href='../';
    b.onclick=()=>{try{localStorage.getItem(k)===l?localStorage.removeItem(k):localStorage.setItem(k,l)}catch(e){}sync()};sync()})();<\/script>`;
    html=html.replace('</body>',controls+'</body>');
    document.open();document.write(html);document.close();
  }catch(err){
    document.body.innerHTML=`<div class="loading"><div><div class="book">HDPS</div><p>책을 불러오지 못했습니다.<br>${String(err.message||err)}</p><p><a href="../" style="color:#75dfa8">← Library</a></p></div></div>`;
  }
})();
</script>
</body>
</html>
