<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05111d"><title>HDPS Digital Library</title><style>
:root{--bg:#05111d;--ink:#f8f6f0;--muted:#a5b1bc;--gold:#f4bd38;--green:#00d995;--line:rgba(255,255,255,.12)}*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;font-family:Inter,"Pretendard","Noto Sans KR",Arial,sans-serif;background:#05111d;color:var(--ink)}body{overflow-x:hidden;background:radial-gradient(circle at 50% 52%,rgba(10,84,144,.34),transparent 34%),linear-gradient(180deg,#04101a 0%,#071724 60%,#040c13 100%)}button{font:inherit}.page{min-height:100dvh;display:grid;grid-template-rows:64px auto 1fr 96px 28px}.top{display:flex;align-items:center;justify-content:space-between;padding:0 2.2vw;border-bottom:1px solid var(--line)}.brand{font-size:16px;font-weight:950;letter-spacing:.13em}.brand em{font-style:normal;color:var(--green)}.langs{display:flex;gap:5px;padding:4px;border:1px solid #ffffff2f;border-radius:999px;background:#061522d9}.langs button{border:0;background:transparent;color:#aab4bd;padding:8px 12px;border-radius:999px;font-size:10px;font-weight:850;cursor:pointer}.langs button.active{background:#0b6b51;color:white;box-shadow:0 0 0 1px #00d99555 inset}.hero{text-align:center;padding:16px 20px 8px}.hero small{color:var(--gold);font-size:9px;font-weight:900;letter-spacing:.18em}.hero h1{margin:8px 0 7px;font-size:clamp(34px,4.2vw,60px);line-height:1.02;letter-spacing:-.055em}.hero .accent{color:#f7bf2d}.hero p{margin:0 auto;color:var(--muted);font-size:12px;line-height:1.6;max-width:900px}.books{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px;align-items:end;width:min(1540px,94vw);margin:0 auto;padding:10px 0 14px}.book{position:relative;min-height:min(520px,58vh);border-radius:10px 22px 16px 8px;padding:28px 26px 24px;color:#fff;box-shadow:0 34px 70px #0009,inset -14px 0 24px #0004,inset 1px 0 #ffffff1f;overflow:hidden;cursor:pointer;transition:.28s ease;isolation:isolate}.book:hover{transform:translateY(-12px) scale(1.015);box-shadow:0 44px 90px #000b}.book:before{content:"";position:absolute;inset:0;background:linear-gradient(105deg,rgba(255,255,255,.08),transparent 24%,transparent 72%,rgba(0,0,0,.22));z-index:-1}.book:after{content:"";position:absolute;inset:-60%;background:linear-gradient(110deg,transparent 43%,rgba(255,255,255,.16) 50%,transparent 57%);transform:translateX(-55%);transition:1s}.book:hover:after{transform:translateX(55%)}.ko{background:linear-gradient(145deg,#0b2c66,#0b58b9 52%,#0b4d72)}.en{background:linear-gradient(145deg,#0f397b,#114c9f 55%,#0b326c)}.pt{background:linear-gradient(145deg,#0b5c43,#0b8a63 58%,#084837)}.zh{background:linear-gradient(145deg,#25245f,#2a3c91 58%,#192758)}.editionline{font-size:9px;font-weight:950;letter-spacing:.1em;color:#d8e4ef}.book h2{margin:28px 0 8px;font-size:clamp(42px,4vw,64px);letter-spacing:-.05em}.booktitle{font-size:clamp(18px,1.55vw,28px);font-weight:900;line-height:1.25;min-height:68px}.flags{display:flex;gap:10px;align-items:center;margin-top:18px;min-height:42px}.flag{width:56px;height:36px;display:block;border-radius:4px;box-shadow:0 4px 12px #0006;background:#fff}.en .flag{width:48px;height:31px}.meta{position:absolute;left:26px;right:26px;bottom:72px;padding-top:14px;border-top:1px solid rgba(255,255,255,.5);font-size:10px;line-height:1.7;color:#e1e9ef}.open{position:absolute;left:22px;right:22px;bottom:20px;border:0;border-radius:999px;background:#f6f2e8;color:#111820;padding:13px 16px;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:space-between;cursor:pointer}.info{width:min(1180px,92vw);margin:0 auto 8px;display:grid;grid-template-columns:repeat(4,1fr);border:1px solid #ffffff26;border-radius:14px;background:#091924df;overflow:hidden}.info>div{padding:12px 16px;border-right:1px solid #ffffff14}.info>div:last-child{border-right:0}.info span{display:block;color:#d8b04f;font-size:8px;font-weight:900;letter-spacing:.12em}.info b{display:block;margin-top:5px;font-size:12px;line-height:1.4}.foot{display:flex;align-items:center;justify-content:center;border-top:1px solid # const E=[{k:'ko',c:'ko',vol:'VOL.01 · KOREAN',title:'LEAN 제조혁신활동',flags:['kr'],path:'ko/?from=library'},{k:'en',c:'en',vol:'VOL.02 · ENGLISH',title:'LEAN Manufacturing Innovation Activities',flags:['in','br','no'],path:'en/?from=library'},{k:'pt',c:'pt',vol:'VOL.03 · PORTUGUÊS',title:'LEAN Atividades de Inovação na Fabricação',flags:['br'],path:'pt-BR/?from=library'},{k:'zh',c:'zh',vol:'VOL.04 · 简体中文',title:'精益制造创新活动',flags:['cn'],path:'zh-CN/?from=library'}];

function renderBooks(){books.innerHTML=E.map(e=>`<article class="book ${e.c}" data-path="${e.path}"><div class="editionline">${e.vol}</div><h2>HDPS</h2><div class="booktitle">${e.title}</div><div class="flags">${e.flags.map(f=>SVG[f]).join('')}</div><div class="meta">${T[ui].pub}　2026.08.20<br>${T[ui].authorL}　${T[ui].author.replace('<br>',' · ')}<br>${T[ui].editionL}　${T[ui].edition}</div><button class="open">${T[ui].read}<b>→</b></button></article>`).join('');document.querySelectorAll('.book').forEach(b=>{b.onclick=e=>{if(!e.target.closest('.open')||e.target.closest('.open'))location.href=b.dataset.path}})}
function apply(l){ui=l;const t=T[l];document.documentElement.lang=l==='pt'?'pt-BR':l==='zh'?'zh-CN':l;headline.innerHTML=t.headline;desc.innerHTML=t.desc;labPub.textContent=t.pub;labAuthor.textContent=t.authorL;author.innerHTML=t.author;labLang.textContent=t.langL;langValue.textContent=t.lang;labEdition.textContent=t.editionL;editionValue.textContent=t.edition;foot.textContent=t.footer;document.querySelectorAll('.langs button').forEach(b=>b.classList.toggle('active',b.dataset.ui===l));renderBooks()}document.querySelectorAll('.langs button').forEach(b=>b.onclick=()=>apply(b.dataset.ui));apply('ko');
