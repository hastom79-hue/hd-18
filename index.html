<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06111b"><title>HDPS Digital Library</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Inter,"Pretendard","Noto Sans KR",Arial,sans-serif;background:#06111b;color:#f7f3e8;overflow:hidden}.library{height:100dvh;display:grid;grid-template-rows:60px auto 1fr 98px;position:relative;background:radial-gradient(circle at 50% 54%,rgba(9,80,135,.34),transparent 38%),linear-gradient(180deg,#04101a,#061827 62%,#050d15)}.topbar{padding:0 2.5vw;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff17}.brand{font-size:15px;font-weight:900;letter-spacing:.12em}.brand em{color:#00e29a;font-style:normal}.langbar{display:flex;gap:5px;padding:4px;border:1px solid #ffffff32;border-radius:999px;background:#07131fcc}.langbtn{border:0;background:transparent;color:#aeb8c2;padding:7px 11px;border-radius:999px;font-size:10px;font-weight:800;cursor:pointer;transition:.2s}.langbtn:hover,.langbtn.active{background:#0c664f;color:#fff;box-shadow:0 0 0 1px #00d99566 inset}.hero{text-align:center;padding:10px 20px 2px}.hero small{color:#f4bd2d;font-size:9px;letter-spacing:.18em;font-weight:900}.hero h1{margin:8px 0 7px;font-size:clamp(31px,3.7vw,51px);line-height:1.04;letter-spacing:-.05em}.hero .accent{color:#f8bd29}.hero p{margin:0 auto;color:#a9b2bc;font-size:11px;line-height:1.55;max-width:820px}.stage{position:relative;display:flex;align-items:end;justify-content:center;min-height:0;padding:0 42px 8px;perspective:1900px}.carousel{position:relative;width:min(1200px,94vw);height:min(500px,57vh);min-height:365px;transform-style:preserve-3d}.book{position:absolute;left:50%;bottom:58px;width:230px;height:335px;border-radius:6px 15px 8px 5px;padding:19px;color:#fff;box-shadow:0 30px 56px #0009,inset -11px 0 20px #0003;transform-origin:50% 100%;transition:transform .6s cubic-bezier(.2,.8,.2,1),opacity .45s;overflow:hidden}.book.ko{background:linear-gradient(145deg,#0b2e67,#0b55ae 54%,#0b4f71)}.book.en{background:linear-gradient(145deg,#0e3778,#114795 58%,#0a326f)}.book.pt{background:linear-gradient(145deg,#0a563f,#0b8060 58%,#074838)}.book.zh{background:linear-gradient(145deg,#25245d,#253b87 58%,#172553)}.book.locked{background:linear-gradient(145deg,#252c34,#11171e);color:#7b858e}.editionline{font-size:8px;font-weight:900;letter-spacing:.08em;color:#d2dfed}.book h3{font-size:38px;margin:25px 0 8px}.booktitle{font-size:13px;font-weight:900;line-height:1.32}.miniFlags{display:flex;gap:6px;margin-top:11px}.flag{display:block;width:27px;height:18px;border-radius:2px}.metaBook{position:absolute;left:19px;right:19px;bottom:50px;padding-top:9px;border-top:1px solid #ffffff73;font-size:7.5px;line-height:1.75}.open{position:absolute;left:16px;right:16px;bottom:12px;border:0;border-radius:999px;background:#f5f0e6;color:#15191e;padding:10px 12px;font-size:9px;font-weight:900;display:flex;justify-content:space-between;cursor:pointer}.lockIcon{font-size:21px;margin-top:42px}.locked b{display:block;margin-top:26px;font-size:21px}.book[data-slot="-2"]{transform:translateX(-285%) translateZ(-210px) rotateY(38deg) scale(.73);opacity:.6}.book[data-slot="-1"]{transform:translateX(-165%) translateZ(-70px) rotateY(24deg) scale(.9);opacity:.94}.book[data-slot="0"]{transform:translateX(-50%) translateZ(115px) scale(1.09);z-index:8}.book[data-slot="1"]{transform:translateX(65%) translateZ(-70px) rotateY(-24deg) scale(.9);opacity:.94}.book[data-slot="2"]{transform:translateX(185%) translateZ(-210px) rotateY(-38deg) scale(.73);opacity:.6}.pedestal{position:absolute;left:50%;bottom:27px;transform:translateX(-50%);width:min(1080px,88vw);height:68px;border-radius:50%;background:linear-gradient(180deg,#142635,#07131e 60%,#03090e);border:3px solid #f0a32e99;box-shadow:0 0 0 5px #f6ab3012,0 10px 38px #ff8a1a55,inset 0 3px 16px #ffbe4f33}.nav{position:absolute;top:46%;width:44px;height:44px;border-radius:50%;border:1px solid #ffffff48;background:#050d14cc;color:#fff;font-size:27px;display:grid;place-items:center;cursor:pointer;z-index:12}.prev{left:20px}.next{right:20px}.dots{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:10px;z-index:15}.dots i{width:8px;height:8px;border-radius:50%;background:#ffffff55}.dots i.active{background:#00dca0;box-shadow:0 0 12px #00dca0}.infoBar{margin:0 auto 11px;width:min(980px,92vw);display:grid;grid-template-columns:repeat(4,1fr);border:1px solid #ffffff28;border-radius:13px;background:#091823d9;overflow:hidden}.infoBar>div{padding:11px 15px;border-right:1px solid #ffffff15}.infoBar>div:last-child{border-right:0}.infoBar span{display:block;color:#d7ae4d;font-size:7px;font-weight:900;letter-spacing:.13em}.infoBar b{display:block;margin-top:5px;font-size:11px;line-height:1.4}.footer{position:absolute;left:0;right:0;bottom:0;height:25px;border-top:1px solid #ffffff12;display:flex;align-items:center;justify-content:center;color:#7c8791;font-size:7px}@media(max-height:820px) and (min-width:901px){.library{grid-template-rows:52px auto 1fr 82px}.hero h1{font-size:36px}.hero p{font-size:9px}.carousel{height:400px;min-height:310px}.book{width:195px;height:285px;bottom:47px}.book h3{font-size:31px;margin-top:18px}.infoBar>div{padding:8px 12px}}@media(max-width:900px){html,body{overflow:auto}.library{height:auto;min-height:100dvh;grid-template-rows:auto auto 600px auto}.topbar{padding:9px 12px;gap:10px;align-items:flex-start}.langbar{flex-wrap:wrap;justify-content:flex-end}.book{width:185px;height:285px}.infoBar{grid-template-columns:1fr 1fr}}</style></head><body><main class="library"><header class="topbar"><strong class="brand"><em>HDPS</em> DIGITAL LIBRARY</strong><nav class="langbar" aria-label="UI language"><button class="langbtn active" data-ui="ko">🇰🇷 한국어</button><button class="langbtn" data-ui="en">🇺🇸 English</button><button class="langbtn" data-ui="pt">🇧🇷 Português</button><button class="langbtn" data-ui="zh">🇨🇳 中文</button></nav></header><section class="hero"><small id="kicker">GLOBAL PRODUCTION INNOVATION PUBLICATION</small><h1 id="headline"></h1><p id="desc"></p></section><section class="stage"><button class="nav prev" id="prev">‹</button><div class="carousel" id="carousel"></div><div class="pedestal"></div><button class="nav next" id="next">›</button><div class="dots" id="dots"></div></section><section class="infoBar"><div><span id="labPub"></span><b>2026.08.20</b></div><div><span id="labAuthor"></span><b id="author"></b></div><div><span id="labLang"></span><b id="languages"></b></div><div><span id="labEdition"></span><b id="edition"></b></div></section><div class="footer" id="footer"></div></main><script>
const T={ko:{headline:'여러 권 중, 지금 읽어야 할 <span class="accent">한 권.</span>',desc:'HD Construction Equipment의 생산혁신체계 HDPS를 소개하는 공식 디지털 홍보책자입니다.<br>좌우로 서재를 회전해 원하는 언어의 에디션을 선택하세요.',pub:'발간일',authorL:'저자',author:'HQ 생산혁신팀<br>서지철 책임매니저',langL:'언어',langs:'4개 언어',editionL:'에디션',edition:'Global Edition',read:'이 책 읽기',locked:'준비 중',footer:'© 2026 · 기밀 · 내부 사용 전용 · 무단 복제/배포 금지'},en:{headline:'Among many books, the <span class="accent">one to read now.</span>',desc:'The official digital publication introducing HDPS, the production innovation system of HD Construction Equipment.<br>Rotate the library and select the edition you want to read.',pub:'PUBLICATION',authorL:'AUTHOR',author:'HQ Production Innovation Team<br>Ji-cheol Seo, Manager',langL:'LANGUAGE',langs:'4 Languages',editionL:'EDITION TYPE',edition:'Global Edition',read:'Read this book',locked:'COMING SOON',footer:'© 2026 · CONFIDENTIAL · INTERNAL USE ONLY · Unauthorized reproduction/distribution prohibited'},pt:{headline:'Entre muitos livros, <span class="accent">um para ler agora.</span>',desc:'Publicação digital oficial que apresenta o HDPS, o sistema de inovação de produção da HD Construction Equipment.<br>Gire a biblioteca e selecione a edição que deseja ler.',pub:'PUBLICAÇÃO',authorL:'AUTOR',author:'Equipe de Inovação de Produção HQ<br>Ji-cheol Seo, Gerente',langL:'IDIOMA',langs:'4 Idiomas',editionL:'TIPO DE EDIÇÃO',edition:'Edição Global',read:'Ler este livro',locked:'EM BREVE',footer:'© 2026 · CONFIDENCIAL · SOMENTE USO INTERNO · Reprodução/distribuição não autorizada proibida'},zh:{headline:'众多书籍中，现在最值得阅读的<span class="accent">一本。</span>',desc:'这是介绍 HD Construction Equipment 生产创新体系 HDPS 的官方数字宣传册。<br>左右旋转书架，选择您希望阅读的语言版本。',pub:'出版日期',authorL:'作者',author:'总部生产创新团队<br>Seo Ji-cheol 责任经理',langL:'语言',langs:'4种语言',editionL:'版本类型',edition:'全球版',read:'阅读本书',locked:'即将推出',footer:'© 2026 · 机密 · 仅限内部使用 · 禁止擅自复制/分发'}};
const F={kr:'🇰🇷',in:'🇮🇳',br:'🇧🇷',no:'🇳🇴',cn:'🇨🇳'};const E={ko:{vol:'VOL.01 · KOREAN',title:'LEAN 제조혁신활동',flags:['kr'],path:'ko/?from=library',c:'ko'},en:{vol:'VOL.02 · ENGLISH',title:'LEAN Manufacturing Innovation Activities',flags:['in','br','no'],path:'en/?from=library',c:'en'},'pt-BR':{vol:'VOL.03 · PORTUGUÊS',title:'LEAN Atividades de Inovação na Fabricação',flags:['br'],path:'pt-BR/?from=library',c:'pt'},'zh-CN':{vol:'VOL.04 · 简体中文',title:'精益制造创新活动',flags:['cn'],path:'zh-CN/?from=library',c:'zh'}};const order=['pt-BR','ko','en','zh-CN'];let selected='ko',ui='ko';
function applyUI(l){ui=l;document.documentElement.lang=l==='pt'?'pt-BR':l==='zh'?'zh-CN':l;const t=T[l];headline.innerHTML=t.headline;desc.innerHTML=t.desc;labPub.textContent=t.pub;labAuthor.textContent=t.authorL;author.innerHTML=t.author;labLang.textContent=t.langL;languages.textContent=t.langs;labEdition.textContent=t.editionL;edition.textContent=t.edition;footer.textContent=t.footer;document.querySelectorAll('.langbtn').forEach(b=>b.classList.toggle('active',b.dataset.ui===l));render()}
function book(k,s){const t=T[ui];if(k==='lock')return `<article class="book locked" data-slot="${s}"><div class="editionline">LOCKED</div><div class="lockIcon">▣</div><b>SMART<br>FACTORY</b><div class="metaBook">${t.locked}</div></article>`;const e=E[k];return `<article class="book ${e.c}" data-key="${k}" data-slot="${s}"><div class="editionline">${e.vol}</div><h3>HDPS</h3><div class="booktitle">${e.title}</div><div class="miniFlags">${e.flags.map(x=>`<span class="flag" style="font-size:18px">${F[x]}</span>`).join('')}</div><div class="metaBook">${T[ui].pub}　2026.08.20<br>${T[ui].authorL}　${T[ui].author.replace('<br>',' · ')}<br>${T[ui].editionL}　Global Edition</div><button class="open">${t.read}<b>→</b></button></article>`}
function render(){const seq=['lock',...order],ci=1+order.indexOf(selected),out=[];[-2,-1,0,1,2].forEach(s=>out.push(book(seq[(ci+s+seq.length)%seq.length],s)));carousel.innerHTML=out.join('');document.querySelectorAll('.book:not(.locked)').forEach(b=>b.querySelector('.open').onclick=()=>location.href=E[b.dataset.key].path);dots.innerHTML=order.map(k=>`<i class="${k===selected?'active':''}"></i>`).join('')}
document.querySelectorAll('.langbtn').forEach(b=>b.onclick=()=>applyUI(b.dataset.ui));next.onclick=()=>{selected=order[(order.indexOf(selected)+1)%4];render()};prev.onclick=()=>{selected=order[(order.indexOf(selected)+3)%4];render()};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')next.click();if(e.key==='ArrowLeft')prev.click()});let sx=0;carousel.onpointerdown=e=>sx=e.clientX;carousel.onpointerup=e=>{const dx=e.clientX-sx;if(Math.abs(dx)>45)(dx<0?next:prev).click()};applyUI('ko');
</script><script src="security.js"></script></body></html>
