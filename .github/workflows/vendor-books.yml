name: Finalize HDPS self-contained language books
on:
  push:
    branches: ["main"]
    paths: [".github/workflows/vendor-books.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Vendor pinned sources and apply final QA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,json,os,re,urllib.request
          from pathlib import Path
          S={
          'ko':('hd-08','49a5dfef4b85937d350c56a87c77fb32a47544c6','d52707b4d1f006a923dca25d84d7ac0b22de5bfb','0e83c16a43a74f84a485aa88cacdc60c75ba0355','우리의 혁신(HDPS), HD건설기계 생산의 기준을 <span class="headline-mark">새로 정립하다</span>','← 서재'),
          'en':('hd-12','b208d03f6d5862b587d40d982311769107323dcc','46e284810ebcab528c166c3cc7ba84a6dee75a47','6201d8c4863103021d1e6027f7bf0cd398113437','Our Production System, HDPS, <span class="headline-mark">Redefines</span> the Standard for Manufacturing','← Library'),
          'pt-BR':('hd-13','621b2b3efe6ad3c7e1a329a49d5ae805b1b46873','c67394882efd3892e2e136854f1cf996139f76eb','6201d8c4863103021d1e6027f7bf0cd398113437','Nosso Sistema de Produção, o HDPS, <span class="headline-mark">Redefine</span> o Padrão da Manufatura','← Biblioteca'),
          'zh-CN':('hd-14','5703c56e918126e0690e81a05c3fab0385c0de1b','202125059b09ececca007a50496da2710aced289','6201d8c4863103021d1e6027f7bf0cd398113437','我们的生产系统 HDPS，<span class="headline-mark">重新定义</span>制造标准','← 书库')}
          def blob(repo,sha):
            u=f'https://api.github.com/repos/hastom79-hue/{repo}/git/blobs/{sha}'
            h={'Accept':'application/vnd.github+json','User-Agent':'hd18-finalizer','Authorization':f'Bearer {os.environ["GH_TOKEN"]}'}
            with urllib.request.urlopen(urllib.request.Request(u,headers=h),timeout=30) as r:d=json.load(r)
            return base64.b64decode(d['content']).decode()
          guard='''
          /* HD-18 FINAL QA */
          html,body{width:100%;max-width:100%;overflow-x:hidden!important}
          .topbar{justify-content:flex-end!important}.topbar>.logo,.topbar>a:has(.logo),.topbar .brand-logo,.topbar .header-logo{display:none!important}
          .headline-mark{display:inline-block!important;white-space:nowrap!important}
          .hdps-library-return{position:fixed;z-index:999998;left:max(14px,env(safe-area-inset-left));bottom:max(14px,env(safe-area-inset-bottom));display:inline-flex;align-items:center;min-height:38px;padding:9px 13px;border:1px solid #ffffff38;border-radius:999px;background:#08101dee;color:#fff!important;text-decoration:none!important;font-size:11px;font-weight:900;box-shadow:0 8px 26px #00000047;backdrop-filter:blur(10px)}
          @media(max-width:760px){.hero{height:auto!important;min-height:max(850px,100svh)!important;padding-bottom:120px!important}.hero h1{word-break:normal!important;overflow-wrap:break-word!important}.framework,.module-detail-section,.principles,.action,.target-impact{max-width:100%!important}.hdps-library-return{font-size:10px;min-height:36px;padding:8px 11px}}
          '''
          purge='''\n\n/* HD-18 FINAL QA: logo reappearance guard */\n(()=>{const purge=()=>document.querySelectorAll('.topbar .logo,.topbar .brand-logo,.topbar .header-logo,.topbar img[alt*="HD Hyundai"],.topbar img[alt*="HD현대"]').forEach(el=>(el.closest('a')||el).remove());purge();new MutationObserver(purge).observe(document.documentElement,{subtree:true,childList:true});})();\n'''
          for lang,(repo,hi,cs,jsa,hero,back) in S.items():
            d=Path(lang);d.mkdir(exist_ok=True)
            html,css,js=blob(repo,hi),blob(repo,cs),blob(repo,jsa)
            if not html.lstrip().lower().startswith('<!doctype'):html='<!doctype html>\n'+html.lstrip()
            html=re.sub(r'<a\b[^>]*>\s*<img\b[^>]*class=["\'][^"\']*\blogo\b[^"\']*["\'][^>]*?/?>\s*</a>','',html,count=1,flags=re.I|re.S)
            html=re.sub(r'<h1\s+class=["\']reveal d1["\']>.*?</h1>',f'<h1 class="reveal d1">{hero}</h1>',html,count=1,flags=re.S)
            html=html.replace('Mantém o layout original do símbolo HDPS com seis princípios','').replace('保留原有 HDPS 六大原则标识布局','')
            label=back.replace('← ','')
            extra=f'''\n<a class="hdps-library-return" href="../" aria-label="{label}">{back}</a>\n<script src="../dynamic-config.js"></script><script src="../hdps-api.js"></script>\n<script>window.HDPS_API?.logAccess({{event:'book_view',edition:'{lang}'}}).catch(()=>{{}});</script><script src="../security.js"></script>\n'''
            html=html.replace('</body>',extra+'</body>')
            (d/'index.html').write_text(html,encoding='utf-8')
            (d/'style.css').write_text(css+'\n'+guard,encoding='utf-8')
            (d/'script.js').write_text(js+purge,encoding='utf-8')
          Path('VENDORED_SOURCES.md').write_text('# HDPS language source snapshot\n\nFour language books are pinned and stored directly in hd-18. Runtime CDN page fetching has been removed. Final patches normalize logo removal, headline highlight scope, library return, access-event hooks, and mobile overflow safeguards.\n',encoding='utf-8')
          PY
      - name: Validate HTML/content and JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          C={'ko':('새로 정립하다','← 서재'),'en':('>Redefines</span> the Standard for Manufacturing','← Library'),'pt-BR':('>Redefine</span> o Padrão da Manufatura','← Biblioteca'),'zh-CN':('>重新定义</span>制造标准','← 书库')}
          for l,(m,b) in C.items():
            h=(Path(l)/'index.html').read_text()
            assert m in h and b in h
            assert 'cdn.jsdelivr.net/gh/hastom79-hue/' not in h
            assert 'class="logo"' not in h
            for f in ('index.html','style.css','script.js'):assert (Path(l)/f).stat().st_size>500
          print('CONTENT_QA_OK')
          PY
          for f in ko/script.js en/script.js pt-BR/script.js zh-CN/script.js hdps-api.js security.js backend/server.mjs; do node --check "$f"; done
          echo JS_SYNTAX_QA_OK
      - name: Commit finalized books
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ko en pt-BR zh-CN VENDORED_SOURCES.md
          git diff --cached --quiet || (git commit -m "Fix self-contained HDPS books and pass final QA" && git push origin HEAD:main)
