name: Deploy HDPS Digital Library to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate final repository state
        run: |
          python - <<'PY'
          from pathlib import Path
          expected={
            'ko':('<span class="headline-mark">새로 정립하다</span>','← 서재'),
            'en':('<span class="headline-mark">Redefines</span> the Standard for Manufacturing','← Library'),
            'pt-BR':('<span class="headline-mark">Redefine</span> o Padrão da Manufatura','← Biblioteca'),
            'zh-CN':('<span class="headline-mark">重新定义</span>制造标准','← 书库')
          }
          root=Path('index.html').read_text(encoding='utf-8')
          cfg=Path('dynamic-config.js').read_text(encoding='utf-8')
          assert 'HDPS Global Digital Brochure' in root
          assert 'Operation Excellence Team' in root and 'Jicheol Seoh' in root
          assert all(x in root for x in ('<span>발행일</span>','<span>발간자</span>','<span>에디션</span>'))
          assert all(x in root for x in ('대한민국 국기','인도 국기','브라질 국기','노르웨이 국기','중국 국기'))
          assert 'language-switch' in root and all(x in root for x in ('한국어','English','Português','简体中文'))
          assert 'www.hd-hyundaice.com/upload/files/2025/05/1f2e5f03-d248-4e1c-9ae9-af0bea67bae4.jpg' in root
          assert 'eu.develon-ce.com/media/inline/25500' in root
          assert 'hdps-global-language-switch' in cfg
          assert all(x in cfg for x in ("['ko','한국어']","['en','English']","['pt-BR','Português']","['zh-CN','简体中文']"))
          for lang,(mark,back) in expected.items():
            for name in ('index.html','style.css','script.js'):
              p=Path(lang)/name
              assert p.exists() and p.stat().st_size>500, f'{p}: missing or too small'
            h=(Path(lang)/'index.html').read_text(encoding='utf-8')
            assert mark in h, f'{lang}: highlight scope mismatch'
            assert back in h, f'{lang}: library return missing'
            assert 'class="logo"' not in h, f'{lang}: removed header logo returned'
            assert 'cdn.jsdelivr.net/gh/hastom79-hue/' not in h, f'{lang}: runtime book CDN dependency returned'
            assert '../security.js' in h and '../hdps-api.js' in h and '../dynamic-config.js' in h, f'{lang}: shared integration missing'
          print('HDPS_CONTENT_QA_OK')
          PY
          for f in dynamic-config.js ko/script.js en/script.js pt-BR/script.js zh-CN/script.js hdps-api.js security.js backend/server.mjs; do
            node --check "$f"
          done
          echo HDPS_JS_QA_OK

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        env:
          HDPS_API_BASE_URL: ${{ vars.HDPS_API_BASE_URL }}
        run: |
          mkdir -p _site
          cp index.html security.js dynamic-config.js hdps-api.js _site/
          cp -R ko en pt-BR zh-CN admin _site/
          touch _site/.nojekyll
          if [ -n "$HDPS_API_BASE_URL" ]; then
            python - <<'PY'
          import os
          from pathlib import Path
          p=Path('_site/dynamic-config.js')
          s=p.read_text(encoding='utf-8')
          url=os.environ.get('HDPS_API_BASE_URL','').rstrip('/')
          s=s.replace('apiBaseUrl: ""', f'apiBaseUrl: "{url}"')
          s=s.replace('backendMode: "static-fallback"', 'backendMode: "dynamic-api"')
          p.write_text(s,encoding='utf-8')
          PY
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
