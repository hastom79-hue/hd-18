name: Repair and validate finalized HDPS scripts
on:
  push:
    branches: ["main"]
    paths: [".github/workflows/fix-final-js.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair accidental literal newline escapes
        run: |
          python - <<'PY'
          from pathlib import Path
          for lang in ('ko','en','pt-BR','zh-CN'):
            p=Path(lang)/'script.js'
            s=p.read_text(encoding='utf-8')
            s=s.replace(r'\n\n/* HD-18 FINAL QA: keep removed header logo from reappearing */\n', '\n\n/* HD-18 FINAL QA: logo reappearance guard */\n')
            s=s.replace(r'})();\n', '})();\n')
            p.write_text(s,encoding='utf-8')
          PY
          for f in ko/script.js en/script.js pt-BR/script.js zh-CN/script.js hdps-api.js security.js backend/server.mjs; do node --check "$f"; done
      - name: Commit repaired scripts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ko/script.js en/script.js pt-BR/script.js zh-CN/script.js
          git diff --cached --quiet || (git commit -m "Repair finalized language JavaScript and validate syntax" && git push origin HEAD:main)
